[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepclustering-metrics"
version = "0.1.0"
description = "Evaluation of internal clustering metrics for deep clustering architectures"
requires-python = ">=3.10"
authors = [
    { name="Tooobiii", email="TBA" }
]
dependencies = [
    "torch @ https://download.pytorch.org/whl/cu128/",
    "numpy",
    "clustpy",
    "pymfe",
    "pandas",
    "torchvision",
    "nltk",
    "scikit-learn",
    "openpyxl",
    "requests"
]

[tool.setuptools.packages.find]
where = ["."]