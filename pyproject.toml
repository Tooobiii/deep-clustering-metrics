[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepclustering-metrics"
version = "0.1.0"
description = "Evaluation of internal clustering metrics for deep clustering architectures"
requires-python = ">=3.10"
authors = [
    { name="Tooobiii", email="TBA" }
]
dependencies = [
    "clustpy",
    "dbcv @ git+https://github.com/FelSiq/DBCV.git",
    "nltk",
    "numpy",
    "opencv-python",
    "pandas",
    "permetrics",
    "pymfe",
    "requests",
    "scikit-learn",
    "torch",
    "torchvision"
]

[tool.setuptools.packages.find]
where = ["."]