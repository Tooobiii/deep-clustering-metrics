[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepclustering-metrics"
version = "1.0.0"
description = "Evaluation of internal clustering metrics for deep clustering architectures"
requires-python = ">=3.10, <3.13"
authors = [
    { name="Tooobiii"}
]
dependencies = [
    "clustpy==0.0.2",
    "nltk==3.9.2",
    "numpy==2.4.2",
    "opencv-python==5.0.0.93",
    "pandas==3.0.0",
    "permetrics==2.0.0",
    "pymfe==0.4.4",
    "pytest==9.0.2",
    "requests==2.32.5",
    "scikit-learn==1.8.0",
    "torch==2.10.0",
    "torchvision==0.25.0"
]

[tool.setuptools.packages.find]
where = ["."]